<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="etlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#etlGrad)"/>
  
  <!-- Database cylinder -->
  <ellipse cx="80" cy="60" rx="30" ry="12" fill="rgba(255,255,255,0.3)"/>
  <rect x="50" y="60" width="60" height="40" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <ellipse cx="80" cy="100" rx="30" ry="12" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2"/>
  
  <!-- Arrow 1 -->
  <path d="M 130 80 L 160 80" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Processing box -->
  <rect x="170" y="50" width="60" height="60" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="2" rx="5"/>
  <text x="200" y="85" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">ETL</text>
  
  <!-- Arrow 2 -->
  <path d="M 240 80 L 270 80" stroke="white" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Output database -->
  <ellipse cx="320" cy="60" rx="30" ry="12" fill="rgba(255,255,255,0.3)"/>
  <rect x="290" y="60" width="60" height="40" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <ellipse cx="320" cy="100" rx="30" ry="12" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="white" />
    </marker>
  </defs>
  
  <!-- Icons for data types -->
  <text x="80" y="35" font-family="Arial" font-size="20" fill="white" text-anchor="middle">📊</text>
  <text x="320" y="35" font-family="Arial" font-size="20" fill="white" text-anchor="middle">💾</text>
</svg>