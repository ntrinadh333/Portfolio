<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="examGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#examGrad)"/>
  
  <!-- Question paper/clipboard -->
  <rect x="60" y="40" width="100" height="120" fill="white" stroke="white" stroke-width="2" rx="5"/>
  
  <!-- Paper lines (questions) -->
  <line x1="75" y1="55" x2="145" y2="55" stroke="#333" stroke-width="2"/>
  <line x1="75" y1="70" x2="130" y2="70" stroke="#999" stroke-width="1.5"/>
  <line x1="75" y1="82" x2="140" y2="82" stroke="#999" stroke-width="1.5"/>
  
  <line x1="75" y1="100" x2="145" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="75" y1="115" x2="130" y2="115" stroke="#999" stroke-width="1.5"/>
  <line x1="75" y1="127" x2="135" y2="127" stroke="#999" stroke-width="1.5"/>
  
  <!-- Checkmark -->
  <circle cx="240" cy="80" r="40" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2"/>
  <path d="M 215 85 L 230 100 L 265 65" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Result badge -->
  <circle cx="320" cy="130" r="35" fill="rgba(255,255,255,0.4)" stroke="white" stroke-width="2"/>
  <text x="320" y="138" font-family="Arial" font-size="28" fill="white" text-anchor="middle" font-weight="bold">A+</text>
  
  <!-- Pencil icon -->
  <text x="180" y="150" font-family="Arial" font-size="28" fill="white">✏️</text>
</svg>