<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="movieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#movieGrad)"/>
  
  <!-- Movie reel -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="100" cy="100" r="38" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>
  <circle cx="100" cy="100" r="30" fill="rgba(255,255,255,0.2)"/>
  <circle cx="100" cy="100" r="15" fill="white"/>
  
  <!-- Film strip -->
  <rect x="160" y="60" width="30" height="80" fill="rgba(255,255,255,0.3)" stroke="white" stroke-width="2" rx="3"/>
  <rect x="165" y="65" width="20" height="12" fill="rgba(0,0,0,0.3)"/>
  <rect x="165" y="82" width="20" height="12" fill="rgba(0,0,0,0.3)"/>
  <rect x="165" y="99" width="20" height="12" fill="rgba(0,0,0,0.3)"/>
  <rect x="165" y="116" width="20" height="12" fill="rgba(0,0,0,0.3)"/>
  
  <!-- Star ratings -->
  <text x="280" y="85" font-family="Arial" font-size="24" fill="white">⭐</text>
  <text x="280" y="120" font-family="Arial" font-size="24" fill="white">⭐</text>
  <text x="320" y="100" font-family="Arial" font-size="24" fill="white">⭐</text>
  
  <!-- Heart for recommendation -->
  <path d="M 360 70 Q 360 55 370 55 Q 380 55 380 65 Q 380 55 390 55 Q 400 55 400 70 Q 400 85 380 100 Q 360 85 360 70" fill="white" opacity="0.8"/>
</svg>